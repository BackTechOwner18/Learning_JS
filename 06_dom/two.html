<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  
    <title>Document</title>

<body style="background-color: black; color : white">
    <div class="parent">
        <div class="child">Monday</div>
        <div class="child"> Tuesday       </div>
        <div class="child"> Wednesday       </div>
        <div class="child"> Thursday        </div>
        <div class="child"> Friday          </div>

    </div>
    
</body>
<script>
    const parent = document.querySelector('.parent')
    console.log(parent);
    console.log(parent.children);
    console.log((parent.children.length));
    console.log(parent.firstElementChild);
    console.log(parent.lastElementChild);
        const firstChild = parent.firstElementChild
        console.log(firstChild);
        console.log(firstChild.nextElementSibling);
        console.log(firstChild.nextElementSibling.previousElementSibling);
        console.log(firstChild.parentElement);
        console.log(firstChild.nextElementSibling.nextElementSibling.previousElementSibling)

        const arr2 = Array.from(document.querySelectorAll('.child'))
        console.log( arr2);

        arr2.forEach((val) => val.style.color = 'orange')

        const arr3 = arr2.filter((val)=> arr2.indexOf(val)===0)

        arr3.forEach((val) => {
            val.style.color = 'yellow' 
            val.innerText = 'baljeet'})
        

            console.log("NODES :" , parent.childNodes);
                //prints a nodeList of elements in div container
    
    

</script>
