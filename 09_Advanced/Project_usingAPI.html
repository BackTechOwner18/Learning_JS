<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>API Project using Fetch</title>
</head>
<body>
    <center><button class="start"> Click here to START</button></center>
</body>
<script>

    let followerCount
    let imageURL

    async function getData()
    {
        try {
            const returnedAPI = await fetch('https://api.github.com/users/hiteshchoudhary')
            const data = await returnedAPI.json()
            followerCount = data['followers']
            imageURL = data['avatar_url']
        } catch (error) {
            console.log(error);
               
        }
    }
    getData()


    const startbutton = document.querySelector('.start')

    startbutton.addEventListener('click', function()
{
    const body = document.querySelector('body')
     body.innerHTML = ` <style>

 transition: transform 0.2s ease, box-shadow 0.2s ease;
}

/* Optional: Slight lift effect on hover */
.card:hover {
 transform: translateY(-4px);
 box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
}

/* Top Image Placement */
.card-img-top {
 width: 100%;

 display: block;
}

/* Inner Body Padding */
.card-body {
 padding: 1.25rem;
}

/* Title Typography */

 margin-top: 0;

/* Content Text Typography */

}

.btn-primary {

.btn-primary:hover {

}

  </style>
   <div class="card" style="width: 18rem;">
  <img class="card-img-top" src=${imageURL} alt="Card image cap">
  <div class="card-body">
    <h5 class="card-title">Hitesh Choudhary</h5>
    <p class="card-text"> -Youtuber/Teacher with ${followerCount} subscribers </p>
    <a href="#" class="btn btn-primary" >Go somewhere</a>
  </div>
</div>`

})

</script>
